# Netlify configuration for Unity WebGL build
# Place this file in your project root

[build]
  publish = "Build/WebGL"
  command = "echo 'Unity WebGL build - deploy the Build/WebGL folder'"

# Headers for Unity WebGL files
[[headers]]
  for = "/*.data"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/*.mem"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/*.symbols.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

# Redirect all routes to index.html for SPA behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

